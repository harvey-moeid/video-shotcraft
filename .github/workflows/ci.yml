name: CI (Cloudflare adaptation)

# Validasi Worker + build workbench + dry-run deploy. Tidak men-deploy apa pun.
on:
  pull_request:
    branches: [cloudflare-free]
  push:
    branches: [cloudflare-free]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Build workbench (static assets)
        working-directory: workbench
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npx vite build

      - name: Worker install
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Wrangler dry-run (validasi config, bundle, assets)
        working-directory: worker
        run: npm run dry-run
