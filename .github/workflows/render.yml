name: Render job (phase 3)

# Dipicu oleh Worker (workflow_dispatch via GitHub API) atau manual oleh pemilik repo.
# Variable repo: STUDIO_BASE_URL (URL Worker, https). Secret repo: STUDIO_API_TOKEN (sama dengan API_TOKEN Worker).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID job render (UUID dari Worker)'
        required: true
        type: string
      project_id:
        description: 'ID proyek di R2'
        required: true
        type: string
      crf:
        description: 'CRF H.264 (15-35)'
        required: false
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: render-job
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Input hanya lewat env (bukan interpolasi ke shell); divalidasi di render/render-job.mjs.
      JOB_ID: ${{ inputs.job_id }}
      PROJECT_ID: ${{ inputs.project_id }}
      CRF: ${{ inputs.crf }}
      STUDIO_BASE_URL: ${{ vars.STUDIO_BASE_URL }}
      STUDIO_API_TOKEN: ${{ secrets.STUDIO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Workbench install
        working-directory: workbench
        run: |
          npm ci --no-audit --no-fund 2>&1 | tail -3
          node scripts/gen-index.mjs 2>&1 | tail -3

      - name: Render job
        run: node render/render-job.mjs
