# Approved showcase submissions are stored in the showcase-media release.
# Publishing the static Gallery to GitHub Pages is a separate manual action.
name: Store approved showcase submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: showcase-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.label.name == 'showcase-approved' &&
      contains(github.event.issue.labels.*.name, 'showcase')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Store submission
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: python3 .github/scripts/showcase-publish.py
      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            "⚠️ Penyimpanan showcase gagal. Silakan periksa [log workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
