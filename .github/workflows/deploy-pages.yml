name: Publish gallery to GitHub Pages (manual)

# Gallery publishing is intentionally opt-in. The application deploys through
# deploy.yml (Cloudflare); this workflow is only for the separate static gallery.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH_GALLERY to publish the static gallery'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.confirm == 'PUBLISH_GALLERY' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a --exclude 'sync-from-cards.py' --exclude 'build-seo.py' --exclude 'fetch-media.sh' --exclude 'assemble-media.py' --exclude '__pycache__' gallery/ site/
          touch site/.nojekyll
      - name: Stamp asset URLs for cache busting
        run: |
          python3 - <<'EOF'
          import hashlib, pathlib, re
          site = pathlib.Path('site')
          assets = {}
          for name in ('styles.css', 'app.js', 'showcase.js', 'translations.js'):
              path = site / name
              if path.exists():
                  assets[name] = hashlib.md5(path.read_bytes()).hexdigest()[:8]
          if not assets:
              raise SystemExit('No known static assets found to stamp')
          pattern = re.compile(r'(?P<attr>href|src)="\\./(?P<name>' + '|'.join(map(re.escape, assets)) + r')(?:\\?v=[^"]*)?"')
          for html in sorted(site.glob('*.html')):
              content = html.read_text(encoding='utf-8')
              stamped, hits = pattern.subn(lambda m: f'{m["attr"]}="./{m["name"]}?v={assets[m["name"]]}"', content)
              if hits:
                  html.write_text(stamped, encoding='utf-8')
                  print(f'{html.name}: stamped {hits} asset link(s)')
          EOF
      - name: Download motion previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 gallery/assemble-media.py site/media
      - name: Download showcase submissions
        env:
          GH_TOKEN: ${{ github.token }
        run: |
          mkdir -p site/showcase-media
          if gh release view showcase-media --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download showcase-media --repo "$GITHUB_REPOSITORY" --dir site/showcase-media --clobber
          fi
          if [ -f site/showcase-media/showcase.json ]; then
            mv site/showcase-media/showcase.json site/api/showcase.json
          else
            printf '{"items": []}\\n' > site/api/showcase.json
          fi
      - name: Check every library preview exists
        run: |
          python3 - <<'EOF'
          import json, os, sys
          lib = json.load(open('site/api/library.json', encoding='utf-8'))
          missing = []
          for card in lib['cards']:
              for style in card['styles']:
                  media = style.get('media')
                  url = media.get('url') if isinstance(media, dict) else media
                  if url:
                      path = os.path.join('site', url.split('?')[0].lstrip('./'))
                      if not os.path.exists(path):
                          missing.append(path)
          if missing:
              print('missing media files:', *missing, sep='\\n  ')
              sys.exit(1)
          print(f'all previews present ({len(lib["cards"])} cards checked)')
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
